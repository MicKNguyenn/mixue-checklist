
<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checklist vệ sinh</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(to bottom,#ffebee,#ffffff);
    min-height:100vh;
}

.phone{

    max-width:430px;
    margin:auto;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-card{

    width:100%;

    background:white;

    border-radius:28px;

    padding:30px 25px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.10);
}

.logo{

    width:95px;
    height:95px;

    background:#e60012;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:auto;

    font-size:42px;

    color:white;

    box-shadow:
    0 8px 20px rgba(230,0,18,.25);
}

.title{

    text-align:center;

    font-weight:700;

    color:#e60012;

    margin-top:18px;

    margin-bottom:8px;
}

.subtitle{

    text-align:center;

    color:#888;

    margin-bottom:28px;

    font-size:15px;
}

.form-label{

    font-weight:600;
}

.form-control{

    height:55px;

    border-radius:15px;

    border:1px solid #ddd;
}

.form-control:focus{

    border-color:#e60012;

    box-shadow:
    0 0 0 .2rem rgba(230,0,18,.15);
}

.btn-login{

    height:55px;

    border-radius:15px;

    background:#e60012;

    border:none;

    font-weight:700;

    font-size:17px;
}

.btn-login:hover{

    background:#c70010;
}

.alert{

    border-radius:15px;
}

.version{

    text-align:center;

    color:#999;

    font-size:13px;

    margin-top:25px;
}

.version span{

    color:#e60012;

    font-weight:700;
}

.copyright{

    margin-top:5px;

    text-align:center;

    font-size:12px;

    color:#bbb;
}

</style>

</head>

<body>

<div class="phone">

    <div class="login-card">

        <div class="logo">
            🧹
        </div>

        <h3 class="title">
            MIXUE CHECKLIST
        </h3>

        <p class="subtitle">
            Báo cáo vệ sinh cửa hàng
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Mã cửa hàng
                </label>

                <input
                type="text"
                name="code"
                maxlength="10"
                class="form-control"
                placeholder="Nhập mã CH"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Mật khẩu
                </label>

                <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
                required>

            </div>

            <button
            class="btn btn-login w-100">

                Đăng nhập

            </button>

        </form>

        {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
        {% endif %}

        <div class="version">

            Version <span>2.0</span> by <span>NGUYEN</span>

        </div>

        <div class="copyright">

            Mixue Store Checklist System

        </div>

    </div>

</div>

</body>

</html>
