<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checklist vệ sinh</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f2f4f7;
    min-height:100vh;
}

.phone{

    max-width:430px;
    margin:auto;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-card{

    width:100%;

    background:white;

    border-radius:20px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.08);
}

.logo{

    width:90px;
    height:90px;

    background:#0d6efd;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:auto;

    font-size:40px;

    color:white;
}

.title{

    text-align:center;

    font-weight:700;

    margin-top:15px;

    margin-bottom:5px;
}

.subtitle{

    text-align:center;

    color:gray;

    margin-bottom:25px;
}

.form-control{

    height:50px;

    border-radius:12px;
}

.btn-login{

    height:50px;

    border-radius:12px;

    font-weight:600;
}

.version{

    text-align:center;

    color:gray;

    font-size:13px;

    margin-top:20px;
}

</style>

</head>

<body>

<div class="phone">

    <div class="login-card">

        <div class="logo">
            🧹
        </div>

        <h3 class="title">
            Checklist vệ sinh
        </h3>

        <p class="subtitle">
            Báo cáo vệ sinh cửa hàng
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Mã cửa hàng
                </label>

                <input
                type="text"
                name="code"
                maxlength="10"
                class="form-control"
                placeholder="Nhập mã CH"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Mật khẩu
                </label>

                <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
                required>

            </div>

            <button
            class="btn btn-primary w-100 btn-login">

                Đăng nhập

            </button>

        </form>

        {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
        {% endif %}

        <div class="version">

            Version 1.0 by NGUYEN

        </div>
        
    </div>

</div>

</body>

</html>
