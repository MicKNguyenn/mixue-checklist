<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f2f4f7;
}

.phone{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    background:white;
    padding:20px;
}

</style>

</head>

<body>

<div class="phone">

<h3>
📊 TRANG QUẢN LÝ QC 📊
</h3>

<div class="d-grid gap-2 mb-3">

    <a
    href="/manage-checklist/"
    class="btn btn-primary">

        📋 Quản lý Checklist

    </a>



</div>

<hr>

<div class="card">

    <div class="card-body">

        <h5>
            📅 Chọn ngày xem báo cáo
        </h5>

        <form
        action="/admin-day/"
        method="GET">

            <input
            type="date"
            name="date"
            value="{{ today|date:'Y-m-d' }}"
            class="form-control mb-3">

            <button
            class="btn btn-primary w-100 mb-2">

                Xem báo cáo

            </button>

            <a
            href="/audit-create/"
            class="btn btn-warning w-100 py-3">
                Chấm điểm cửa hàng
            </a>

            <a href="/audits/" class="btn btn-info w-100 mt-2">
                📋 Xem danh sách Audit
            </a>

            <a href="/kpi-dashboard/" class="btn btn-info w-100 mt-2">
                📋 Xem biểu bảng checklist hàng ngày
            </a>

            
        </form>
        <div class="card mt-3 p-3">

                <h6>📋 Xuất báo cáo audit QC</h6>

                <form action="/export-kpi-auditqc/" method="GET">

                    <label>Từ ngày</label>
                    <input type="date" name="start" class="form-control mb-2">

                    <label>Đến ngày</label>
                    <input type="date" name="end" class="form-control mb-2">

                    <button class="btn btn-success w-100">
                        📥 Xuất Excel báo cáo QC
                    </button>

                </form>

            </div>
    </div>

</div>

</div>

<hr>

{% for date in dates %}

<a
href="/admin-day/{{ date|date:'Y-m-d' }}/"
class="btn btn-outline-primary w-100 mb-2">

📅 {{ date|date:"d/m/Y" }}

</a>

{% empty %}


{% endfor %}

</div>

</body>

</html>
