<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm điểm cửa hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4" style="max-width:700px;">

    <div class="card shadow">
        <div class="card-body">

            <h3 class="mb-4">
                Chấm điểm cửa hàng
            </h3>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Cửa hàng
                    </label>

                    <select class="form-select" name="store_id" required>

                        {% for store in stores %}
                        <option value="{{ store.id }}">
                            {{ store.code }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Điểm QC
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="score"
                        required>
                </div>

                <hr>

                <h5>Các lỗi QC</h5>

                <div id="issues"></div>

                <button
                    type="button"
                    class="btn btn-warning mb-3"
                    onclick="addIssue()">

                    + Thêm lỗi

                </button>

                <div>
                    <button
                        type="submit"
                        class="btn btn-primary">

                        Lưu kết quả

                    </button>
                </div>

                <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary w-100 mt-3 py-2">
                    ⬅ Về Admin Dashboard
                </a>
            </form>

        </div>
    </div>

</div>

<script>

let issueIndex = 1;

function addIssue() {

    const container =
        document.getElementById("issues");

    container.insertAdjacentHTML(
        "beforeend",
        `
        <div class="card mb-3 p-3">

            <div class="mb-2">

                <label>
                    Ảnh lỗi
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="image_${issueIndex}"
                    accept="image/*">

            </div>

            <div>

                <label>
                    Mô tả lỗi
                </label>

                <textarea
                    class="form-control"
                    name="note_${issueIndex}"
                    rows="3"
                    placeholder="Ví dụ: Kệ bụi bẩn, cần vệ sinh..."></textarea>

            </div>

        </div>
        `
    );

    issueIndex++;
}

addIssue();

</script>

</body>
</html>
