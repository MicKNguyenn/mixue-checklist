<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit QC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .score-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: white;
            padding: 12px;
            border-radius: 12px;
        }

        .category {
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .item {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #fff;
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
        }

        .fail-box {
            display: none;
            margin-top: 10px;
        }
        .loading-overlay{

            position:fixed;
            inset:0;

            background:rgba(0,0,0,.65);

            display:none;

            justify-content:center;
            align-items:center;

            z-index:99999;

        }

        .loading-box{

            width:300px;

            background:white;

            border-radius:20px;

            padding:28px;

            text-align:center;

            box-shadow:0 10px 35px rgba(0,0,0,.25);

        }

        .spinner-border{

            width:60px;
            height:60px;

        }
        .status-toggle{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .status-toggle input{
            display:none;
        }

        .status-btn{

            min-width:82px;

            padding:8px 14px;

            border-radius:30px;

            text-align:center;

            font-size:13px;

            font-weight:bold;

            cursor:pointer;

            user-select:none;

            transition:.25s;

            background:#28a745;

            color:white;

        }

        .status-toggle input:checked + .status-btn{

            background:#dc3545;

        }

        .status-btn::after{

            content:"✓ ĐẠT";

        }

        .status-toggle input:checked + .status-btn::after{

            content:"✕ FAIL";

        }
        .score-bar{

            position:sticky;

            top:10px;

            z-index:999;

            background:#fff;

            border-radius:18px;

            padding:18px 22px;

            box-shadow:0 8px 20px rgba(0,0,0,.08);

        }

        .score-circle{

            width:90px;

            height:90px;

            border-radius:50%;

            background:linear-gradient(135deg,#0d6efd,#4da3ff);

            color:#fff;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            box-shadow:0 8px 18px rgba(13,110,253,.3);

        }

        .score-circle span{

            font-size:30px;

            font-weight:700;

            line-height:1;

        }

        .score-circle small{

            font-size:14px;

            opacity:.9;

        }
    </style>
</head>

<body>

<div class="container py-3" style="max-width: 720px;">

    <!-- SCORE -->
    <div class="score-bar shadow-sm mb-3">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <div class="text-muted small">
                    Điểm Audit
                </div>

                <div class="fs-4 fw-bold">
                    Tổng điểm
                </div>
            </div>

            <div class="score-circle">

                <span id="score">200</span>

                <small>/200</small>

            </div>

        </div>

    </div>

        <form
        id="auditForm"
        method="POST"
        enctype="multipart/form-data">
        {% csrf_token %}

        <!-- STORE -->
        <div class="mb-3">
            <label class="form-label">Cửa hàng</label>
            <select class="form-select" name="store_id" required>
                {% for store in stores %}
                    <option value="{{ store.id }}">{{ store.code }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- CHECKLIST -->
        {% for category in categories %}
        <div class="card category shadow-sm mb-3">

            <div class="card-header bg-white">
                <b>{{ category.title }}</b>
            </div>

            <div class="card-body">

                {% for item in category.items.all %}

                <div class="item">

                    <div class="d-flex justify-content-between align-items-center">

                        <div class="item-title">
                            {{ item.title }}
                            <small class="text-muted">({{ item.score }}đ)</small>
                        </div>

                        <!-- FAIL CHECKBOX -->
                        <div class="status-toggle">

                            <input
                                id="status{{ item.id }}"
                                type="checkbox"
                                name="status_{{ item.id }}"
                                value="fail"
                                onchange="toggleFail(this,{{ item.id }})">

                            <label
                                for="status{{ item.id }}"
                                class="status-btn">
                            </label>

                        </div>

                    </div>

                    <!-- FAIL INPUT -->
                    <div class="fail-box" id="fail_{{ item.id }}">

                        <input type="file"
                            name="image_{{ item.id }}"
                            class="form-control mt-2"
                            accept="image/*"
                            multiple>

                        <textarea name="note_{{ item.id }}"
                            class="form-control mt-2"
                            rows="2"
                            placeholder="Ghi chú lỗi..."></textarea>

                    </div>

                </div>

                {% endfor %}

            </div>
        </div>
        {% endfor %}

        <!-- SUBMIT -->
        <button
        id="submitBtn"
        type="submit"
        class="btn btn-danger w-100 py-3 fw-bold fs-5">

        Lưu kết quả Audit

        </button>
        
    </form>
    <div class="mt-3">
        <button
            type="button"
            class="btn btn-outline-secondary w-100"
            onclick="history.back()">

            ⬅ Quay lại

        </button>
    </div>
</div>

<script>

function toggleFail(el,id){

    const box=document.getElementById("fail_"+id);

    box.style.display=el.checked
        ? "block"
        : "none";

}

const form=document.getElementById("auditForm");

form.addEventListener("submit",function(e){

    document.getElementById("loadingOverlay").style.display="flex";

    document.getElementById("submitBtn").disabled=true;

});

window.onbeforeunload=function(){

    if(
        document.getElementById("loadingOverlay").style.display==="flex"
    ){
        return "";
    }

};

</script>

<!-- Loading -->
<div id="loadingOverlay" class="loading-overlay">

    <div class="loading-box">

        <div class="spinner-border text-danger"></div>

        <h5 class="mt-3 mb-2">
            Đang lưu Audit...
        </h5>

        <p class="text-muted mb-0">
            Vui lòng chờ trong giây lát.<br>
            Không tắt hoặc tải lại trang.
        </p>

    </div>

</div>
</body>
</html>
