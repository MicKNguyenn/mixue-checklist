<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit QC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .score-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: white;
            padding: 12px;
            border-radius: 12px;
        }

        .category {
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .item {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #fff;
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
        }

        .fail-box {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container py-3" style="max-width: 720px;">

    <!-- SCORE -->
    <div class="score-bar shadow-sm mb-3">
        <h5 class="mb-0">Tổng điểm: <span id="score">200</span>/200</h5>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- STORE -->
        <div class="mb-3">
            <label class="form-label">Cửa hàng</label>
            <select class="form-select" name="store_id" required>
                {% for store in stores %}
                    <option value="{{ store.id }}">{{ store.code }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- CHECKLIST -->
        {% for category in categories %}
        <div class="card category shadow-sm mb-3">

            <div class="card-header bg-white">
                <b>{{ category.title }}</b>
            </div>

            <div class="card-body">

                {% for item in category.items.all %}

                <div class="item">

                    <div class="d-flex justify-content-between align-items-center">

                        <div class="item-title">
                            {{ item.title }}
                            <small class="text-muted">({{ item.score }}đ)</small>
                        </div>

                        <!-- FAIL CHECKBOX -->
                        <div>
                            <input type="checkbox"
                                   name="status_{{ item.id }}"
                                   value="fail"
                                   onchange="toggleFail(this, {{ item.id }})">
                            <small>Fail</small>
                        </div>

                    </div>

                    <!-- FAIL INPUT -->
                    <div class="fail-box" id="fail_{{ item.id }}">

                        <input type="file"
                            name="image_{{ item.id }}"
                            class="form-control mt-2"
                            accept="image/*"
                            multiple>

                        <textarea name="note_{{ item.id }}"
                            class="form-control mt-2"
                            rows="2"
                            placeholder="Ghi chú lỗi..."></textarea>

                    </div>

                </div>

                {% endfor %}

            </div>
        </div>
        {% endfor %}

        <!-- SUBMIT -->
        <button class="btn btn-primary w-100 py-2">
            Lưu kết quả
        </button>

    </form>
</div>

<script>
function toggleFail(el, id) {
    const box = document.getElementById("fail_" + id);
    box.style.display = el.checked ? "block" : "none";
}
</script>

</body>
</html>
