
<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Lịch sử Audit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f4f6f7;
    margin:0;
    padding:0;
}

.container-phone{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:12px;
    min-height:100vh;
}

.page-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:15px;
}

.audit-card{
    border:none;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.2s;
    background:#fff;
}

.audit-card:active{
    transform:scale(.98);
}

.audit-link{
    text-decoration:none;
    color:#212529;
    display:block;
}

.store-code{
    font-size:18px;
    font-weight:700;
}

.audit-date{
    font-size:13px;
    color:#6c757d;
}

.score-box{
    text-align:right;
}

.score{
    font-size:24px;
    font-weight:700;
    color:#0d6efd;
    line-height:1;
}

.score-text{
    font-size:12px;
    color:#6c757d;
}

.badge-score{
    font-size:12px;
    padding:5px 10px;
    border-radius:20px;
}

.sticky-footer{
    position:sticky;
    bottom:10px;
    margin-top:15px;
}

.empty-box{
    border-radius:16px;
    text-align:center;
    padding:25px;
}

@media(max-width:480px){

    .store-code{
        font-size:16px;
    }

    .score{
        font-size:22px;
    }

    .page-title{
        font-size:20px;
    }

}

</style>

</head>

<body>

<div class="container-phone">

<div class="page-title">
📋 Lịch sử Audit
</div>

{% for audit in audits %}

<a
href="{% url 'staff_dashboard_by_audit' audit.id %}"
class="audit-link">

<div class="card audit-card mb-3">

<div class="card-body">

<div class="d-flex justify-content-between align-items-center">

<div>

<div class="store-code">
🏪 {{ audit.store.code }}
</div>

<div class="audit-date">
📅 {{ audit.created_at|date:"d/m/Y H:i" }}
</div>

</div>

<div class="score-box">

<div class="score">
{{ audit.score }}
</div>

<div class="score-text">
điểm
</div>

{% if audit.score >= 180 %}

<span class="badge bg-success badge-score">
Xuất sắc
</span>

{% elif audit.score >= 150 %}

<span class="badge bg-warning text-dark badge-score">
Khá
</span>

{% else %}

<span class="badge bg-danger badge-score">
Cần cải thiện
</span>

{% endif %}

</div>

</div>

</div>

</div>

</a>

{% empty %}

<div class="alert alert-warning empty-box">

<h5>
😢
</h5>

<div>
Chưa có lịch sử audit
</div>

</div>

{% endfor %}

<div class="sticky-footer">

<button
onclick="history.back()"
class="btn btn-outline-secondary w-100">

⬅ Quay lại

</button>

</div>

</div>

</body>

</html>
