<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lịch sử Audit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f7;
}

.container-phone{
    max-width:480px;
    margin:auto;
    padding:10px;
}

.card{
    border:none;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.score{
    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container-phone">

<h5 class="fw-bold mb-3">
📋 Lịch sử Audit
</h5>

{% for audit in audits %}

<a href="{% url 'staff_dashboard_by_audit' audit.id %}" style="text-decoration:none; color:inherit;">

<div class="card mb-3 p-3">

<div class="d-flex justify-content-between">

<div>
<div class="fw-bold">{{ audit.store.code }}</div>
<div class="text-secondary small">
{{ audit.created_at|date:"d/m/Y H:i" }}
</div>
</div>

<div class="text-end">
<div class="score text-primary">
{{ audit.score }}
</div>
<div class="small text-secondary">
điểm
</div>
</div>

</div>

</div>

</a>

{% empty %}

<div class="alert alert-warning text-center">
Chưa có lịch sử audit
</div>

{% endfor %}


<!-- BACK -->
<button onclick="history.back()" class="btn btn-outline-secondary w-100 mt-2">
⬅ Quay lại
</button>

</div>

</body>
</html>
