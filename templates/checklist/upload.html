<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chụp ảnh Checklist</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f3f5f7;
    font-family:Arial,Helvetica,sans-serif;
}

.phone{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:20px;
    display:flex;
    align-items:center;
}

.card-upload{

    width:100%;

    background:white;

    border-radius:24px;

    padding:30px 24px;

    box-shadow:0 8px 30px rgba(0,0,0,.08);

}

.logo{

    width:90px;
    height:90px;

    border-radius:50%;

    background:#d70018;

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;

    margin:auto;

}

.title{

    text-align:center;
    margin-top:20px;

    font-size:22px;
    font-weight:bold;

}

.subtitle{

    text-align:center;

    color:#777;

    margin-top:10px;
    margin-bottom:28px;

}

.btn-camera{

    height:58px;

    border:none;

    border-radius:15px;

    background:#d70018;

    font-size:18px;

    font-weight:bold;

}

.btn-camera:hover{

    background:#bf0015;

}

.note{

    margin-top:25px;

    background:#fff4f4;

    border:1px solid #ffd4d4;

    border-radius:14px;

    padding:15px;

    color:#d70018;

    text-align:center;

    font-size:14px;

}

/* ===== Loading ===== */

.loading{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

.loading-box{

    width:290px;

    background:white;

    border-radius:18px;

    padding:28px;

    text-align:center;

}

.loading-box h5{

    margin-top:18px;

    font-weight:bold;

}

.loading-box p{

    color:#666;

    font-size:14px;

}

.spinner-border{

    width:55px;

    height:55px;

}

</style>

</head>

<body>

<div class="phone">

<div class="card-upload">

<div class="logo">
📷
</div>

<div class="title">
{{ item.title }}
</div>

<div class="subtitle">
Chụp ảnh để hoàn thành checklist
</div>

<form
id="uploadForm"
method="POST"
enctype="multipart/form-data">

{% csrf_token %}

<input
id="cameraInput"
type="file"
name="image"
accept="image/*"
capture="environment"
style="display:none"
required>

<button
type="button"
class="btn btn-danger btn-camera w-100"
onclick="openCamera()">

📷 Chụp ảnh ngay

</button>

<button
id="submitBtn"
type="submit"
style="display:none">
</button>

</form>

<div class="note">

Sau khi chụp ảnh hệ thống sẽ tự động tải lên.<br>

<strong>Không tắt ứng dụng trong lúc tải.</strong>

</div>

</div>

</div>

<!-- Loading -->

<div class="loading" id="loading">

<div class="loading-box">

<div class="spinner-border text-danger"></div>

<h5>

Đang tải ảnh...

</h5>

<p>

Vui lòng chờ vài giây.<br>

Không thoát hoặc bấm quay lại.

</p>

</div>

</div>

<script>

const loading=document.getElementById("loading");

function openCamera(){

    document.getElementById("cameraInput").click();

}

document.getElementById("cameraInput").addEventListener("change",function(){

    if(this.files.length>0){

        loading.style.display="flex";

        document.querySelector(".btn-camera").disabled=true;

        document.getElementById("submitBtn").click();

    }

});

window.onbeforeunload=function(){

    if(loading.style.display==="flex"){

        return "";

    }

};

</script>

</body>
</html>
