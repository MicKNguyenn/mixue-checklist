<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chụp ảnh</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f5f7;
    min-height:100vh;
}

.phone{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:20px;
}

.card-upload{
    background:white;
    border-radius:25px;
    padding:30px 25px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.logo{

    width:90px;
    height:90px;

    background:#d70018;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:40px;

    margin:auto;
}

.title{
    text-align:center;
    margin-top:18px;
    font-weight:700;
    color:#222;
}

.subtitle{
    text-align:center;
    color:#888;
    margin-bottom:30px;
}

.btn-camera{

    background:#d70018;
    border:none;

    height:55px;

    border-radius:15px;

    font-weight:600;
    font-size:17px;

    transition:.2s;
}

.btn-camera:hover{
    background:#bc0015;
}

.note-box{
    background:#fff5f5;
    border:1px solid #ffd4d8;
    color:#d70018;
    border-radius:15px;
    padding:15px;
    margin-top:25px;
    text-align:center;
    font-size:14px;
}

</style>

</head>

<body>

<div class="phone">

    <div class="card-upload">

        <div class="logo">
            📷
        </div>

        <h3 class="title">
            {{ item.title }}
        </h3>

        <div class="subtitle">
            Chụp ảnh để hoàn thành checklist
        </div>

        <form id="uploadForm"
            method="POST"
            enctype="multipart/form-data">

            {% csrf_token %}

            <input
                id="cameraInput"
                type="file"
                name="image"
                accept="image/*"
                capture="environment"
                style="display:none"
                required>

            <button
                type="button"
                class="btn btn-danger w-100 btn-camera"
                onclick="openCamera()">

                📷 Chụp ảnh ngay

            </button>

            <button
                id="hiddenSubmitBtn"
                type="submit"
                style="display:none">

            </button>

        </form>

        <div class="note-box">

            Sau khi chụp ảnh, hệ thống sẽ tự động tải lên và đánh dấu hoàn thành.

        </div>

    </div>

</div>

<script>

function openCamera(){

    document.getElementById("cameraInput").click();

}

document.getElementById("cameraInput").addEventListener("change",function(){

    if(this.files.length > 0){

        document.getElementById("hiddenSubmitBtn").click();

    }

});

</script>

</body>
</html>
