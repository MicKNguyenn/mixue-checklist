<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chụp ảnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h3>📷 {{ item.title }}</h3>
    <hr>

    <form id="uploadForm" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input id="cameraInput" type="file" name="image" accept="image/*" capture="environment" style="display:none" required>

        <button type="button" class="btn btn-primary w-100" onclick="openCamera()">
            📷 Chụp ảnh
        </button>

        <button id="hiddenSubmitBtn" type="submit" style="display:none"></button>
    </form>
</div>

<script>
function openCamera(){
    document.getElementById("cameraInput").click();
}

document.getElementById("cameraInput").addEventListener("change", function(){
    if(this.files.length > 0){
        // THAY VÌ .submit() form trực tiếp bằng js gây mất file
        // HÃY KÍCH HOẠT SỰ KIỆN CLICK VÀO NÚT SUBMIT THẬT CỦA HTML
        document.getElementById("hiddenSubmitBtn").click(); 
    }
});
</script>

</body>
</html>
