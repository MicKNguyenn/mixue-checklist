<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Chi tiết cửa hàng</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f2f4f7;
}

.phone{
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:white;
    padding:20px;
}

img{
    width:100%;
    border-radius:10px;
}

.topbar{
    position:sticky;
    top:0;
    background:white;
    z-index:999;
    padding-top:10px;
    padding-bottom:10px;
    border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<div class="phone">

<div class="d-flex justify-content-between align-items-center mb-3">

    <a
        href="/admin-day/{{ selected_date|date:'Y-m-d' }}/"
        class="btn btn-outline-dark">

        ← Quay lại

    </a>

    <button
        type="button"
        id="approveAllBtn"
        class="btn btn-success">

        ✓ Duyệt tất cả đạt

    </button>

</div>

<h3>
    CH {{ store.code }}
</h3>

<p>
    📅 {{ selected_date|date:"d/m/Y" }}
</p>

<hr>

<div class="accordion" id="slotAccordion">

{% for section in data %}

<div class="accordion-item">

    <h2 class="accordion-header">

        <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#slot{{ section.slot.id }}">

            🕒 {{ section.slot.name }}

        </button>

    </h2>

    <div
        id="slot{{ section.slot.id }}"
        class="accordion-collapse collapse">

        <div class="accordion-body">

            {% for row in section.items %}

                {% if row.report %}

                <div class="mb-4">

                    <h6 class="fw-bold">
                        {{ row.item.title }}
                    </h6>

                    <img src="{{ row.report.image }}">

                    <form class="review-form mt-2">

                        {% csrf_token %}

                        <input
                            type="hidden"
                            name="report_id"
                            value="{{ row.report.id }}">

                        <select
                            name="status"
                            class="form-select mb-2">

                            <option value="pending"
                            {% if row.report.status == 'pending' %}selected{% endif %}>
                                ⏳ Chưa đánh giá
                            </option>

                            <option value="pass"
                            {% if row.report.status == 'pass' %}selected{% endif %}>
                                ✅ Đạt
                            </option>

                            <option value="fail"
                            {% if row.report.status == 'fail' %}selected{% endif %}>
                                ❌ Không đạt
                            </option>

                        </select>

                        <textarea
                            name="note"
                            class="form-control mb-2"
                            placeholder="Nhập nhận xét">{{ row.report.note|default:'' }}</textarea>

                        <button
                            type="submit"
                            class="btn btn-primary w-100 save-btn">
                            Lưu đánh giá
                        </button>

                    </form>

                    <hr>

                </div>

                {% else %}

                <div class="alert alert-danger">
                    ❌ {{ row.item.title }}
                </div>

                {% endif %}

            {% endfor %}

        </div>

    </div>

</div>

{% endfor %}

</div>


</div>
</div>
<script>

document.querySelectorAll(".review-form").forEach(form => {

    form.addEventListener("submit", async function(e) {

        e.preventDefault();

        const btn = form.querySelector(".save-btn");

        // tránh double click
        btn.disabled = true;
        btn.innerHTML = "Đang lưu...";

        try {

            const formData = new FormData(form);

            const res = await fetch(window.location.href, {
                method: "POST",
                body: formData,
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            });

            const data = await res.json();

            if (data.success) {

                btn.classList.remove("btn-primary");
                btn.classList.add("btn-success");
                btn.innerHTML = "✓ Đã lưu";

                setTimeout(() => {
                    resetButton(btn);
                }, 1200);

            } else {
                resetButton(btn);
                alert("Lưu thất bại!");
            }

        } catch (err) {

            console.log(err);
            resetButton(btn);
            alert("Có lỗi xảy ra!");

        }

    });

});

function resetButton(btn) {
    btn.disabled = false;
    btn.classList.remove("btn-success");
    btn.classList.add("btn-primary");
    btn.innerHTML = "Lưu đánh giá";
}

</script>
<script>

document.getElementById("approveAllBtn").addEventListener("click", async function () {

    const btn = this;

    const confirmed = confirm(
        "Bạn có chắc muốn đánh dấu TẤT CẢ checklist đã báo cáo là ĐẠT không?"
    );

    if (!confirmed) {
        return;
    }

    btn.disabled = true;
    btn.innerHTML = "⏳ Đang duyệt...";

    try {

        const formData = new FormData();

        formData.append("approve_all", "1");

        const csrfToken = document.querySelector(
            '[name=csrfmiddlewaretoken]'
        ).value;

        const res = await fetch(window.location.href, {

            method: "POST",

            body: formData,

            headers: {
                "X-CSRFToken": csrfToken,
                "X-Requested-With": "XMLHttpRequest"
            }

        });

        const data = await res.json();

        if (data.success) {

            btn.classList.remove("btn-success");
            btn.classList.add("btn-primary");

            btn.innerHTML =
                `✓ Đã duyệt ${data.count} checklist`;

            // reload để toàn bộ trạng thái trên trang cập nhật
            setTimeout(() => {
                window.location.reload();
            }, 1000);

        } else {

            btn.disabled = false;
            btn.innerHTML = "✓ Duyệt tất cả đạt";

            alert(data.message || "Duyệt thất bại!");

        }

    } catch (err) {

        console.log(err);

        btn.disabled = false;
        btn.innerHTML = "✓ Duyệt tất cả đạt";

        alert("Có lỗi xảy ra!");

    }

});

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
